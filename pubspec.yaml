name: pheditor
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 4.3.0
  firebase_auth: 6.1.3
  cloud_firestore: 6.1.1
  equatable: 2.0.8
  flutter_bloc: 9.1.1
  go_router: 17.0.1
  cached_network_image: 3.4.1
  http: 1.6.0
  image_picker: 1.2.1
  share_plus: 12.0.1
  flutter_local_notifications: 19.5.0
  path_provider: 2.1.5
  flutter_dotenv: 6.0.0
  image_gallery_saver_plus: 4.0.1
  connectivity_plus: 7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.3
  flutter_native_splash: 2.4.5

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/Icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
          weight: 400
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
    - family: PressStart2P
      fonts:
        - asset: fonts/PressStart2P-Regular.ttf
    - family: Icons
      fonts:
        - asset: fonts/ph.ttf
